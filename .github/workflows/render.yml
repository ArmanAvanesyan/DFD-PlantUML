name: Render compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render offline and test compatibility
        run: python3 -u scripts/check.py
      - name: Retain render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-render-evidence
          path: build/checks/
  remote:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Render commit-pinned remote includes
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -u scripts/check.py --remote-ref "$SOURCE_SHA"
      - name: Retain remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-render-evidence
          path: build/remote/
