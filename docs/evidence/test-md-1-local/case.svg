nt-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="251.6719" x="14.748" y="332.3281">!if $__DFD_PROCESS_COUNT &gt; 0</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="352.8232" x="24.4961" y="348.625">!error "DFD Level 0 allows only one process"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="46.7578" x="14.748" y="364.9219">!endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="455.6904" x="14.748" y="381.2188">!$__DFD_PROCESS_COUNT = $__DFD_PROCESS_COUNT + 1</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="5" y="397.5156">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="498.7432" x="14.748" y="413.8125">' precompute (so we don&#8217;t pass an expression as an argument)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="265.5078" x="14.748" y="430.1094">!$pLabel = "0 | " + $label + "\n\n"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="5" y="446.4063">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="731.6982" x="14.748" y="462.7031">__Component($alias, $pLabel, $DEFAULT_PROCESS_SHAPE, $DEFAULT_PROCESS_FILLCOLOR)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="116.5938" x="5" y="479">!endprocedure</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="4.874" x="5" y="495.2969">&#160;</text><